# SPA config for the React site: clean URLs fall back to index.html.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # hashed assets are immutable — cache hard
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /equipment/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # everything else: serve the app (BrowserRouter handles the route). index.html
  # references hashed assets, so it must never be served stale — no-cache forces
  # a revalidation on every load instead of relying on browser heuristics.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
