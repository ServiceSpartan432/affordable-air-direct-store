# Static hosting for affordableairdirect.com (the React site) on the VPS.
# Lives at /opt/aad-site on the server. `html/` holds the built dist.
services:
  app:
    image: nginx:alpine
    container_name: aad_site
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [npm]

networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
